name: Feature Request
description: Suggest an improvement
title: "feat: <description>"
labels:
  - enhancement
body:
  - type: textarea
    id: problem_or_use_case
    attributes:
      label: Problem or Use Case
      description: A clear and concise description of the problem or use case.
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of the solution you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
  - type: checkboxes
    id: affected_areas
    attributes:
      label: Affected Areas
      description: Select areas affected by this feature.
      options:
        - label: Environment
          value: environment
        - label: Training
          value: training
        - label: Monitoring
          value: monitoring
        - label: Fault Injection
          value: fault_injection
        - label: Verification
          value: verification
        - label: Recovery
          value: recovery
        - label: Evaluation
          value: evaluation
        - label: Documentation
          value: documentation
    validations:
      required: false