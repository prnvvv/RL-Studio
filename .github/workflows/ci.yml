name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pip install pydantic

      - name: Validate shared schemas (Python)
        run: |
          PYTHONPATH=. python scripts/validate_schemas.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend schemas
        working-directory: frontend
        run: npx tsc --noEmit --skipLibCheck src/schemas/shared.ts

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "../requirements.txt" ]; then pip install -r ../requirements.txt; fi
          pip install pydantic ruff pytest

      - name: Verify Python import
        run: |
          PYTHONPATH=.. python -c "import sys; print(f'Python {sys.version}')"

      - name: Validate schemas
        working-directory: .
        run: |
          PYTHONPATH=. python scripts/validate_schemas.py

      - name: Run lint (ruff)
        working-directory: .
        run: |
          if command -v ruff &>/dev/null; then
            ruff check backend shared scripts
          else
            echo "No lint tool found — skipping"
          fi

      - name: Run type-check (mypy)
        run: |
          if command -v mypy &>/dev/null; then
            mypy . --explicit-package-bases || true
          else
            echo "MyPy not found — skipping type-check"
          fi

      - name: Run tests (pytest)
        run: |
          PYTHONPATH=.. python -m pytest -x -v ../backend

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate shared schemas types
        run: npx tsc --noEmit --skipLibCheck src/schemas/shared.ts

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
